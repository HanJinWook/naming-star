name: 미리보기 APK 빌드

# GitHub에서 수동으로 실행하면 디버그 APK를 만들어줘요.
# 실행 후 Actions 탭의 해당 실행 페이지 맨 아래 Artifacts에서 받아 폰에 설치하면 돼요.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jakmyeongbyeol-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
